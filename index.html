<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08030f"><title>MOTO — The Awakening</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Manrope:wght@300;400;600&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020b;color:#fff;font-family:Manrope,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 15%,#05020b99 70%,#05020b 100%)}.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:grain .3s steps(2) infinite}@keyframes grain{to{transform:translate(-2%,1%)}}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.55em;text-transform:uppercase;color:#e7c68f;opacity:0;animation:rise 1s 1s forwards}h1{font:500 clamp(54px,11vw,124px) Cinzel,serif;letter-spacing:.2em;padding-left:.2em;margin:20px 0 10px;background:linear-gradient(110deg,#fff4d1,#d99b42,#fff1c9,#e6a0ed,#fff0be);background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;text-shadow:0 0 45px #ffcf7730;opacity:0;transform:scale(.9);animation:title 1.8s 1.5s forwards,shine 8s 3.3s linear infinite}.sub{font-size:clamp(10px,1.3vw,13px);letter-spacing:.38em;text-transform:uppercase;color:#e8d5b8;opacity:0;animation:rise 1s 2.2s forwards}@keyframes rise{to{opacity:1;transform:translateY(0)}}@keyframes title{to{opacity:1;transform:scale(1)}}@keyframes shine{to{background-position:220% center}}
.cta{pointer-events:auto;margin-top:44px;border:1px solid #f4d08c88;border-radius:999px;padding:15px 31px;background:linear-gradient(110deg,#7c3d6d66,#b7803555,#5a398366);color:#fff3d6;font:600 10px Manrope;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 35px #e9ae5b35,inset 0 0 18px #f5d68a22;backdrop-filter:blur(10px);opacity:0;animation:rise 1s 2.8s forwards;transition:.3s}.cta:hover{transform:translateY(-3px);box-shadow:0 0 55px #f2c16b88;border-color:#ffe3a9}.hint{position:fixed;bottom:25px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.28em;color:#d6c5a3aa;text-transform:uppercase;opacity:0;animation:rise 1s 3.5s forwards}
#reveal{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity 2s}#reveal.show{opacity:1}#reveal span{font:500 clamp(19px,4vw,43px) Cinzel,serif;letter-spacing:.25em;color:#ffe7b3;text-shadow:0 0 30px #ffbd57,0 0 80px #e85bdc;text-align:center}
body.opening .ui{animation:fade 1.6s forwards}@keyframes fade{to{opacity:0;transform:scale(1.1);filter:blur(8px)}}@media(max-width:600px){.eyebrow{letter-spacing:.3em}.sub{letter-spacing:.2em}.cta{margin-top:34px;padding:14px 24px}.hint{font-size:8px}}
</style></head><body><canvas id="scene"></canvas><div class="vignette"></div><div class="grain"></div>
<main class="ui"><div class="eyebrow">A universe made for you</div><h1>MOTO</h1><div class="sub">The infinite experience</div><button class="cta" id="enter">Enter the universe</button></main><div class="hint">A new world is waiting beyond the light</div><div id="reveal"><span>WELCOME TO YOUR UNIVERSE</span></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#scene'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05020b);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.z=12;
scene.add(new THREE.AmbientLight(0x9b6aa8,1.1));const gold=new THREE.PointLight(0xffc66e,95,30);gold.position.set(0,0,2);scene.add(gold);const pink=new THREE.PointLight(0xc34dff,48,24);pink.position.set(-4,2,-1);scene.add(pink);const blue=new THREE.PointLight(0x3bdfff,34,20);blue.position.set(4,-2,-2);scene.add(blue);
const portal=new THREE.Group();scene.add(portal);const core=new THREE.Mesh(new THREE.CircleGeometry(2.02,96),new THREE.MeshBasicMaterial({color:0x190b29,transparent:true,opacity:.92}));portal.add(core);
const glow=new THREE.Mesh(new THREE.CircleGeometry(1.82,96),new THREE.MeshBasicMaterial({color:0xe879ff,transparent:true,opacity:.16}));glow.position.z=.04;portal.add(glow);
for(let i=0;i<6;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(2.02+i*.095,.018+(i%2)*.012,12,180),new THREE.MeshStandardMaterial({color:i%2?0xe88cff:0xffd17d,metalness:.85,roughness:.2,emissive:i%2?0x8a2da7:0x8b511c,emissiveIntensity:1.25}));ring.position.z=.12-i*.025;portal.add(ring)}
const inner=new THREE.Mesh(new THREE.TorusGeometry(1.8,.035,16,160),new THREE.MeshBasicMaterial({color:0xffe9bd}));inner.position.z=.15;portal.add(inner);
const orbit=new THREE.Group();portal.add(orbit);for(let i=0;i<54;i++){const a=i/54*Math.PI*2,m=new THREE.Mesh(new THREE.SphereGeometry(.022+(i%4)*.009,12,12),new THREE.MeshBasicMaterial({color:i%3===0?0x8defff:0xffd98a}));m.position.set(Math.cos(a)*2.1,Math.sin(a)*2.1,.2);orbit.add(m)}
const N=2300,pos=new Float32Array(N*3),col=new Float32Array(N*3);for(let i=0;i<N;i++){let a=Math.random()*Math.PI*2,r=2+Math.random()*30;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-.5)*24;pos[i*3+2]=-Math.random()*30-2;let c=new THREE.Color().setHSL(Math.random()*.85,.8,.58+Math.random()*.3);col.set([c.r,c.g,c.b],i*3)}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.9})));
const dustN=1300,dp=new Float32Array(dustN*3),dc=new Float32Array(dustN*3);for(let i=0;i<dustN;i++){let a=Math.random()*Math.PI*2,r=2.1+Math.random()*5;dp[i*3]=Math.cos(a)*r;dp[i*3+1]=Math.sin(a)*r;dp[i*3+2]=(Math.random()-.5)*5;let c=new THREE.Color().setHSL(.08+Math.random()*.82,.9,.65);dc.set([c.r,c.g,c.b],i*3)}
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));dg.setAttribute('color',new THREE.BufferAttribute(dc,3));const dust=new THREE.Points(dg,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(dust);
const clock=new THREE.Clock();let opening=false,start=0;function frame(){requestAnimationFrame(frame);let t=clock.getElapsedTime();portal.rotation.z=Math.sin(t*.18)*.035;orbit.rotation.z=t*.08;dust.rotation.z=t*.025;gold.intensity=85+Math.sin(t*2.2)*13;if(opening){let p=Math.min((t-start)/4.2,1);portal.scale.setScalar(1+p*8);camera.position.z=12-p*8.2;camera.position.x=Math.sin(p*2)*.2;camera.position.y=Math.cos(p*2)*.12;core.material.opacity=1-p*.65;if(p>.52)document.querySelector('#reveal').classList.add('show');if(p>=1)document.querySelector('#reveal span').textContent='MOTO · THE INFINITE EXPERIENCE'}renderer.render(scene,camera)}frame();
function heartbeat(){try{const ctx=new AudioContext();for(let n=0;n<5;n++)setTimeout(()=>{if(ctx.state==='closed')return;let now=ctx.currentTime;[0,.18].forEach((d,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=i?62:72;g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(.11,now+d+.025);g.gain.exponentialRampToValueAtTime(.0001,now+d+.16);o.connect(g).connect(ctx.destination);o.start(now+d);o.stop(now+d+.18)})},n*1150)}catch(e){}}
document.querySelector('#enter').onclick=()=>{if(opening)return;opening=true;start=clock.getElapsedTime();document.body.classList.add('opening');heartbeat()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script></body></html>
