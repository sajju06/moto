<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08030f"><title>MOTO — The Kingdom of MOTO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Manrope:wght@300;400;600&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020b;color:#fff;font-family:Manrope,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 15%,#05020b99 70%,#05020b 100%)}.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:grain .3s steps(2) infinite}@keyframes grain{to{transform:translate(-2%,1%)}}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.55em;text-transform:uppercase;color:#e7c68f;opacity:0;animation:rise 1s 1s forwards}h1{font:500 clamp(54px,11vw,124px) Cinzel,serif;letter-spacing:.2em;padding-left:.2em;margin:20px 0 10px;background:linear-gradient(110deg,#fff4d1,#d99b42,#fff1c9,#e6a0ed,#fff0be);background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;text-shadow:0 0 45px #ffcf7730;opacity:0;transform:scale(.9);animation:title 1.8s 1.5s forwards,shine 8s 3.3s linear infinite}.sub{font-size:clamp(10px,1.3vw,13px);letter-spacing:.38em;text-transform:uppercase;color:#e8d5b8;opacity:0;animation:rise 1s 2.2s forwards}@keyframes rise{to{opacity:1;transform:translateY(0)}}@keyframes title{to{opacity:1;transform:scale(1)}}@keyframes shine{to{background-position:220% center}}
.cta{pointer-events:auto;margin-top:44px;border:1px solid #f4d08c88;border-radius:999px;padding:15px 31px;background:linear-gradient(110deg,#7c3d6d66,#b7803555,#5a398366);color:#fff3d6;font:600 10px Manrope;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 35px #e9ae5b35,inset 0 0 18px #f5d68a22;backdrop-filter:blur(10px);opacity:0;animation:rise 1s 2.8s forwards;transition:.3s}.cta:hover{transform:translateY(-3px);box-shadow:0 0 55px #f2c16b88;border-color:#ffe3a9}.chapter2{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7vh 20px 30px;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.5s}.chapter2.show{opacity:1}.chapter2 h2{font:500 clamp(25px,5vw,54px) Cinzel,serif;letter-spacing:.14em;margin:0 0 12px;color:#ffe4ad;text-shadow:0 0 28px #ffb84c88}.chapter2 p{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#f6d7d0}.palace-btn{pointer-events:auto;margin-top:20px;border:1px solid #ffe2ad99;border-radius:999px;padding:13px 25px;background:#6b3b7b77;color:#fff0d3;letter-spacing:.2em;font:600 10px Manrope;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 0 28px #ffcf7544}.chapter2 .royal{position:absolute;bottom:8vh;font:500 12px Cinzel,serif;letter-spacing:.35em;color:#ffe4b8;text-shadow:0 0 25px #ffb84c}.hint{position:fixed;bottom:25px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.28em;color:#d6c5a3aa;text-transform:uppercase;opacity:0;animation:rise 1s 3.5s forwards}
#reveal{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity 2s}#reveal.show{opacity:1}#reveal span{font:500 clamp(19px,4vw,43px) Cinzel,serif;letter-spacing:.25em;color:#ffe7b3;text-shadow:0 0 30px #ffbd57,0 0 80px #e85bdc;text-align:center}
body.opening .ui{animation:fade 1.6s forwards}@keyframes fade{to{opacity:0;transform:scale(1.1);filter:blur(8px)}}@media(max-width:600px){.eyebrow{letter-spacing:.3em}.sub{letter-spacing:.2em}.cta{margin-top:34px;padding:14px 24px}.hint{font-size:8px}}
</style></head><body><canvas id="scene"></canvas><div class="vignette"></div><div class="grain"></div>
<main class="ui"><div class="eyebrow">A universe made for you</div><h1>MOTO</h1><div class="sub">The infinite experience</div><button class="cta" id="enter">Enter the universe</button></main><div class="hint">A new world is waiting beyond the light</div><div id="reveal"><span>WELCOME TO YOUR UNIVERSE</span><button class="palace-btn" id="toKingdom" style="pointer-events:auto;display:none;margin-top:28px">Discover the Kingdom</button></div><section class="chapter2" id="chapter2"><h2>THE KINGDOM OF MOTO</h2><p>A royal universe created in your honour</p><button class="palace-btn" id="openPalace">Open the Palace Doors</button><div class="royal">MOTO · THE QUEEN OF THIS KINGDOM</div></section>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#scene'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05020b);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.z=12;
scene.add(new THREE.AmbientLight(0x9b6aa8,1.1));const gold=new THREE.PointLight(0xffc66e,95,30);gold.position.set(0,0,2);scene.add(gold);const pink=new THREE.PointLight(0xc34dff,48,24);pink.position.set(-4,2,-1);scene.add(pink);const blue=new THREE.PointLight(0x3bdfff,34,20);blue.position.set(4,-2,-2);scene.add(blue);
const portal=new THREE.Group();scene.add(portal);const core=new THREE.Mesh(new THREE.CircleGeometry(2.02,96),new THREE.MeshBasicMaterial({color:0x190b29,transparent:true,opacity:.92}));portal.add(core);
const glow=new THREE.Mesh(new THREE.CircleGeometry(1.82,96),new THREE.MeshBasicMaterial({color:0xe879ff,transparent:true,opacity:.16}));glow.position.z=.04;portal.add(glow);
for(let i=0;i<6;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(2.02+i*.095,.018+(i%2)*.012,12,180),new THREE.MeshStandardMaterial({color:i%2?0xe88cff:0xffd17d,metalness:.85,roughness:.2,emissive:i%2?0x8a2da7:0x8b511c,emissiveIntensity:1.25}));ring.position.z=.12-i*.025;portal.add(ring)}
const inner=new THREE.Mesh(new THREE.TorusGeometry(1.8,.035,16,160),new THREE.MeshBasicMaterial({color:0xffe9bd}));inner.position.z=.15;portal.add(inner);
const orbit=new THREE.Group();portal.add(orbit);for(let i=0;i<54;i++){const a=i/54*Math.PI*2,m=new THREE.Mesh(new THREE.SphereGeometry(.022+(i%4)*.009,12,12),new THREE.MeshBasicMaterial({color:i%3===0?0x8defff:0xffd98a}));m.position.set(Math.cos(a)*2.1,Math.sin(a)*2.1,.2);orbit.add(m)}
const N=2300,pos=new Float32Array(N*3),col=new Float32Array(N*3);for(let i=0;i<N;i++){let a=Math.random()*Math.PI*2,r=2+Math.random()*30;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-.5)*24;pos[i*3+2]=-Math.random()*30-2;let c=new THREE.Color().setHSL(Math.random()*.85,.8,.58+Math.random()*.3);col.set([c.r,c.g,c.b],i*3)}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.9})));
const dustN=1300,dp=new Float32Array(dustN*3),dc=new Float32Array(dustN*3);for(let i=0;i<dustN;i++){let a=Math.random()*Math.PI*2,r=2.1+Math.random()*5;dp[i*3]=Math.cos(a)*r;dp[i*3+1]=Math.sin(a)*r;dp[i*3+2]=(Math.random()-.5)*5;let c=new THREE.Color().setHSL(.08+Math.random()*.82,.9,.65);dc.set([c.r,c.g,c.b],i*3)}
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));dg.setAttribute('color',new THREE.BufferAttribute(dc,3));const dust=new THREE.Points(dg,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(dust);

// CHAPTER 02 — THE KINGDOM OF MOTO
const kingdom=new THREE.Group();scene.add(kingdom);kingdom.visible=false;
const mat=(color,metalness=.35,roughness=.45,emissive=0x000000)=>new THREE.MeshStandardMaterial({color,metalness,roughness,emissive,emissiveIntensity:.35});
const goldMat=mat(0xe8b85f,.82,.22,0x8b541b),ivory=mat(0xffe8d0,.28,.3),rose=mat(0xc76d9e,.42,.3,0x55203e),deep=mat(0x38204e,.45,.28),water= new THREE.MeshStandardMaterial({color:0x5bd9f4,metalness:.55,roughness:.12,transparent:true,opacity:.8,emissive:0x125d8a,emissiveIntensity:.5});
function block(parent,w,h,d,x,y,z,material, bevel=false){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);parent.add(m);return m}
function tower(x,z,h){const t=new THREE.Group();t.position.set(x,0,z);kingdom.add(t);const base=new THREE.Mesh(new THREE.CylinderGeometry(.72,.95,h,12),ivory);base.position.y=h/2;t.add(base);const band=new THREE.Mesh(new THREE.CylinderGeometry(.78,.78,.16,12),goldMat);band.position.y=h*.72;t.add(band);const roof=new THREE.Mesh(new THREE.ConeGeometry(.95,1.65,12),rose);roof.position.y=h+.78;t.add(roof);const tip=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),goldMat);tip.position.y=h+1.62;t.add(tip)}
// Royal island and grand palace
const island=new THREE.Mesh(new THREE.CylinderGeometry(11,8.4,1.1,64),mat(0x302344,.2,.8));island.position.set(0,-1.15,-3);kingdom.add(island);
const lawn=new THREE.Mesh(new THREE.CircleGeometry(10.5,64),mat(0x285d52,.05,.9));lawn.rotation.x=-Math.PI/2;lawn.position.set(0,-.56,-3);kingdom.add(lawn);
block(kingdom,8,4.1,3.1,0,1.55,-4.2,ivory);block(kingdom,8.5,.22,3.5,0,3.7,-4.2,goldMat);
block(kingdom,3.2,5.5,2.8,0,2.25,-2.5,rose);block(kingdom,2.8,.22,3,0,5.05,-2.5,goldMat);
for(let x of [-3.6,3.6])tower(x,-4.2,5.2);
for(let x of [-1.25,1.25])tower(x,-2.5,3.8);
const dome=new THREE.Mesh(new THREE.SphereGeometry(1.65,32,20,0,Math.PI*2,0,Math.PI/2),goldMat);dome.position.set(0,5,-4.1);kingdom.add(dome);
const spire=new THREE.Mesh(new THREE.ConeGeometry(.42,1.8,16),rose);spire.position.set(0,6.5,-4.1);kingdom.add(spire);
// Grand staircase
for(let i=0;i<13;i++){let w=2.1+i*.34;block(kingdom,w,.2,.62,0,-.35+i*.17,-.2-i*.45,goldMat)}
// Palace doors
const doors=new THREE.Group();doors.position.set(0,1.35,-.93);kingdom.add(doors);const left=block(doors,1.25,2.7,.18,-.62,0,0,deep),right=block(doors,1.25,2.7,.18,.62,0,0,deep);for(let x of [-.62,.62]){const ornament=new THREE.Mesh(new THREE.CircleGeometry(.32,24),goldMat);ornament.position.set(x,0,.11);doors.add(ornament)}
// Fountains and gardens
for(let x of [-6.2,6.2]){const bowl=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.35,.42,32),goldMat);bowl.position.set(x,-.12,-1.6);kingdom.add(bowl);const pool=new THREE.Mesh(new THREE.CylinderGeometry(.95,.95,.12,32),water);pool.position.set(x,.12,-1.6);kingdom.add(pool);const jet=new THREE.Mesh(new THREE.CylinderGeometry(.08,.18,1.6,12),water);jet.position.set(x,.9,-1.6);kingdom.add(jet);for(let j=0;j<8;j++){let a=j*Math.PI/4;const flower=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10),mat(j%2?0xff82c8:0xffd46f,.1,.4));flower.position.set(x+Math.cos(a)*1.7,-.25,-1.6+Math.sin(a)*1.7);kingdom.add(flower)}}
for(let i=0;i<22;i++){let a=i/22*Math.PI*2,r=7.8;let x=Math.cos(a)*r,z=-3+Math.sin(a)*r;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.07,.11,.65,8),mat(0x65422e));trunk.position.set(x,-.1,z);kingdom.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(.48,12,10),mat(i%3===0?0xf08ab9:0x48a878,.05,.7));crown.position.set(x,.42,z);kingdom.add(crown)}
// Floating islands and waterfalls
for(let i=0;i<5;i++){let x=(i-2)*5.4,z=-9-(i%2)*3,y=3.5+(i%3)*1.2;const rock=new THREE.Mesh(new THREE.ConeGeometry(1.6,2.8,7),mat(0x574267,.1,.85));rock.position.set(x,y,z);kingdom.add(rock);const top=new THREE.Mesh(new THREE.CylinderGeometry(1.65,1.4,.35,16),mat(0x347d67));top.position.set(x,y+1.25,z);kingdom.add(top);const fall=new THREE.Mesh(new THREE.CylinderGeometry(.12,.3,3.6,10),water);fall.position.set(x,y-1.9,z);kingdom.add(fall)}
// Birds as small gliding silhouettes
const birds=[];for(let i=0;i<9;i++){const b=new THREE.Group();let body=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),mat(0x24172e));body.scale.set(1.5,.5,.5);b.add(body);for(let s of [-1,1]){const wing=new THREE.Mesh(new THREE.ConeGeometry(.12,.65,5),mat(0x24172e));wing.rotation.z=s*1.1;wing.position.x=s*.22;b.add(wing)}b.position.set((Math.random()-.5)*18,4+Math.random()*5,-7-Math.random()*9);kingdom.add(b);birds.push(b)}
const kingdomLight=new THREE.PointLight(0xffc77b,150,45);kingdomLight.position.set(0,8,1);kingdom.add(kingdomLight);
const clock=new THREE.Clock();let opening=false,start=0,inKingdom=false,doorsOpen=false;function frame(){requestAnimationFrame(frame);let t=clock.getElapsedTime();if(inKingdom){birds.forEach((b,i)=>{b.position.x=Math.sin(t*.22+i)*9;b.position.z=-7-i%4*2+Math.cos(t*.3+i)*1.2;b.rotation.y=Math.sin(t*.22+i)*.4});kingdom.rotation.y=Math.sin(t*.12)*.025}portal.rotation.z=Math.sin(t*.18)*.035;orbit.rotation.z=t*.08;dust.rotation.z=t*.025;gold.intensity=85+Math.sin(t*2.2)*13;if(opening){let p=Math.min((t-start)/4.2,1);portal.scale.setScalar(1+p*8);camera.position.z=12-p*8.2;camera.position.x=Math.sin(p*2)*.2;camera.position.y=Math.cos(p*2)*.12;core.material.opacity=1-p*.65;if(p>.52){document.querySelector('#reveal').classList.add('show');document.querySelector('#toKingdom').style.display='block'}if(p>=1)document.querySelector('#reveal span').textContent='MOTO · THE INFINITE EXPERIENCE'}renderer.render(scene,camera)}frame();
function heartbeat(){try{const ctx=new AudioContext();for(let n=0;n<5;n++)setTimeout(()=>{if(ctx.state==='closed')return;let now=ctx.currentTime;[0,.18].forEach((d,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=i?62:72;g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(.11,now+d+.025);g.gain.exponentialRampToValueAtTime(.0001,now+d+.16);o.connect(g).connect(ctx.destination);o.start(now+d);o.stop(now+d+.18)})},n*1150)}catch(e){}}
document.querySelector('#toKingdom').onclick=()=>{document.querySelector('#reveal').classList.remove('show');document.querySelector('#reveal').style.opacity='0';document.querySelector('.hint').style.display='none';document.querySelector('.chapter2').classList.add('show');portal.visible=false;kingdom.visible=true;inKingdom=true;camera.position.set(0,8,17);camera.lookAt(0,1,-3);scene.background=new THREE.Color(0x24133c);gold.position.set(-5,9,2);pink.position.set(7,5,-5);blue.position.set(0,2,-12);};
document.querySelector('#openPalace').onclick=()=>{if(doorsOpen)return;doorsOpen=true;left.position.x=-1.22;right.position.x=1.22;left.rotation.y=.8;right.rotation.y=-.8;document.querySelector('#openPalace').textContent='WELCOME, QUEEN MOTO';};
document.querySelector('#enter').onclick=()=>{if(opening)return;opening=true;start=clock.getElapsedTime();document.body.classList.add('opening');heartbeat()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script></body></html>
